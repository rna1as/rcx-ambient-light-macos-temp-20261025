name: Premium Apple Silicon candidate DMG

on:
  push:
    branches: [premium-apple-silicon]
    paths:
      - ".github/workflows/build-premium-macos-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Premium arm64 candidate
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Unpack isolated macOS source
        run: unzip -q RCX_macOS_Preparation_Public.zip -d .
      - name: Install Apple Silicon Qt 5 SDK
        run: |
          brew install qt@5
          QT_ROOT="$(brew --prefix qt@5)"
          echo "QT_ROOT=$QT_ROOT" >> "$GITHUB_ENV"
          lipo -archs "$QT_ROOT/lib/QtCore.framework/QtCore" | grep -qw arm64
      - name: Build Qt tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qt-src" "$RUNNER_TEMP/qt-install" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/qt-src"
          curl -fL --retry 3 https://download.qt.io/archive/qt/5.15/5.15.19/submodules/qtserialport-everywhere-opensource-src-5.15.19.tar.xz -o serial.tar.xz
          tar -xf serial.tar.xz
          SERIAL_SRC="$(find . -maxdepth 1 -type d -name 'qtserialport-*5.15.19' -print -quit)"
          test -n "$SERIAL_SRC"
          cd "$SERIAL_SRC"
          "$QT_ROOT/bin/qmake" qtserialport.pro
          make -j"$(sysctl -n hw.ncpu)"
          QT_PREFIX="$("$QT_ROOT/bin/qmake" -query QT_INSTALL_PREFIX)"
          make install INSTALL_ROOT="$RUNNER_TEMP/qt-install"
          rsync -a "$RUNNER_TEMP/qt-install$QT_PREFIX/" "$QT_PREFIX/"
          cd "$RUNNER_TEMP/qt-src"
          curl -fL --retry 3 https://download.qt.io/archive/qt/5.15/5.15.19/submodules/qttools-everywhere-opensource-src-5.15.19.tar.xz -o tools.tar.xz
          tar -xf tools.tar.xz
          TOOLS_PRO="$(find "$RUNNER_TEMP/qt-src" -path '*/src/macdeployqt/macdeployqt/macdeployqt.pro' -print -quit)"
          test -f "$TOOLS_PRO"
          mkdir -p "$RUNNER_TEMP/macdeployqt-build"
          cd "$RUNNER_TEMP/macdeployqt-build"
          "$QT_ROOT/bin/qmake" "$TOOLS_PRO" QMAKE_APPLE_DEVICE_ARCHS=arm64
          sed -i '' "s|/bin/macdeployqt|$RUNNER_TEMP/bin/macdeployqt|g" Makefile
          make -j"$(sysctl -n hw.ncpu)"
          test -x "$RUNNER_TEMP/bin/macdeployqt"
          cp "$RUNNER_TEMP/bin/macdeployqt" "$QT_ROOT/bin/macdeployqt"
      - name: Prepare Premium source for macOS
        run: |
          mv macos/source-premium/Software/VERSION macos/source-premium/Software/RCX_VERSION.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('macos/source-premium/Software/grab/MacUtils.mm')
          s=p.read_text().replace('[[CBBlueLightClient alloc]', '[[NSClassFromString(@"CBBlueLightClient") alloc]').replace('[CBBlueLightClient supportsBlueLightReduction]', '[NSClassFromString(@"CBBlueLightClient") supportsBlueLightReduction]')
          p.write_text(s)
          p=Path('macos/build_macos.py')
          s=p.read_text().replace("run(['lipo','-verify_arch',args.arch,mac/name],work,env)", "run(['lipo',mac/name,'-verify_arch',args.arch],work,env)")
          s=s.replace("if not f.is_file() or f.is_symlink():continue", "if f == mac/'RCX_Launcher': continue" + chr(10) + "        if not f.is_file() or f.is_symlink():continue")
          s=s.replace("run([qmake, ROOT/'native'/pro, *qargs], cwd, env)", "run([qmake, ROOT/'native'/pro, *qargs, 'DESTDIR='+str(cwd)], cwd, env)")
          p.write_text(s)
          PY
      - name: Build Premium ARM64 DMG
        working-directory: macos
        run: python3 build_macos.py --sku premium --arch arm64 --qt "$QT_ROOT" --minimum 12.0
      - name: Upload Premium ARM64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: RCX-premium-macOS-arm64-candidate
          path: |
            macos/artifacts/premium/arm64/**/RCX-*.dmg
            macos/artifacts/premium/arm64/**/SHA256SUMS.txt
            macos/artifacts/premium/arm64/**/BUILD_STATUS.json
            macos/artifacts/premium/arm64/**/native-smoke-tests.txt
          if-no-files-found: error
          retention-days: 14
